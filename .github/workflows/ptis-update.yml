name: PTIS Update Check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 1'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    if: github.repository != 'kijm32-ops/flight-bot'
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can never push changes under .github/workflows. An optional
      # PTIS_UPDATE_TOKEN (fine-grained PAT with Contents, Pull requests and
      # Workflows write access) lets those updates reach the update branch.
      - name: Check out installed repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PTIS_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply upstream PTIS update
        run: python update_ptis.py --apply --yes

      - name: Detect update
        id: update
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(tr -d '[:space:]' < PTIS_VERSION)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit update branch
        if: steps.update.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          version="${{ steps.update.outputs.version }}"
          branch="ptis-update-v${version//./-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: update PTIS to v$version"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git push --force-with-lease origin "$branch"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not push $branch. Workflow-file changes need PTIS_UPDATE_TOKEN or a local update."
          fi

      - name: Request manual update when push is blocked
        if: steps.update.outputs.changed == 'true' && steps.commit.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTIS_VERSION: ${{ steps.update.outputs.version }}
        shell: bash
        run: |
          title="PTIS update v${PTIS_VERSION} needs a manual apply"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Manual update issue #$existing is already open."
            exit 0
          fi

          body="PTIS v${PTIS_VERSION} is available, but GitHub Actions cannot push updates that change .github/workflows with the default GITHUB_TOKEN, so no update branch or PR was created.

          Apply it from a clean local clone (this keeps data/state.json, data/kakao_auth.json and user_config.json):

              python update_ptis.py --apply
              git add -A
              git commit -m \"chore: update PTIS to v${PTIS_VERSION}\"
              git push

          Optional, to automate this in the future: add a repository secret named PTIS_UPDATE_TOKEN containing a fine-grained personal access token for this repository with Contents, Pull requests and Workflows read/write access."
          gh issue create --title "$title" --body "$body" \
            || echo "::warning::Could not create the manual update issue. Run python update_ptis.py --apply locally."

      - name: Open update pull request
        if: steps.update.outputs.changed == 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PTIS_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
          PTIS_VERSION: ${{ steps.update.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          existing="$(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PTIS update PR #$existing is already open."
            exit 0
          fi

          body="Automated PTIS program update to v${PTIS_VERSION}.

          This PR is intentionally review-only. It does not update data/state.json,
          data/kakao_auth.json, an existing user_config.json, or repository Secrets."

          if ! gh pr create             --base "$BASE_BRANCH"             --head "$UPDATE_BRANCH"             --title "Update PTIS to v${PTIS_VERSION}"             --body "$body"; then
            echo "::warning::The update branch was pushed, but GitHub Actions could not create the PR."
            echo "::warning::Open a pull request from $UPDATE_BRANCH into $BASE_BRANCH manually."
          fi
