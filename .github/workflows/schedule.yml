name: Daily Flight Deal Scraper

on:
  schedule:
    # UTC 19:00 = KST 익일 04:00. GitHub 예약 실행은 보통 2~4시간 지연되어(최근 실측
    # 09:15~10:59 KST 시작) 실제로는 KST 07시 안팎에 도착한다.
    # 실행 시점 기준 KST 날짜(요일·로테이션)는 이전과 동일하다.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force_deep_scan:
        description: '심층 검색 강제 실행 (토요일이 아니어도 deep 프로필 포함)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    outputs:
      configured: ${{ steps.setup-check.outputs.configured }}
    steps:
      - name: PTIS 설정 확인
        id: setup-check
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PTIS is not configured yet: SERPAPI_KEY is missing, so the bot run is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  run-bot:
    needs: preflight
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 파이썬 환경 설정
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 특가 수집 스크립트 실행
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_TOKEN_ENCRYPTION_KEY: ${{ secrets.KAKAO_TOKEN_ENCRYPTION_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          FORCE_DEEP_SCAN: ${{ inputs.force_deep_scan && '1' || '0' }}
        run: python main.py

      - name: 상태 데이터 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          test ! -f data/kakao_auth.json || git add data/kakao_auth.json
          git diff --staged --quiet || git commit -m "chore: 상태 데이터 갱신 [skip ci]"
          git push

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
